# Desarrollo local. Docker Compose lo aplica solo con `docker compose up`.
# Backend con autorecarga de Django y frontend con hot reload de Vite.

services:
  db:
    ports:
      - "${POSTGRES_PORT_HOST:-5433}:5432"

  backend:
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-mecatronica}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@localhost}
    volumes:
      - ./backend:/app
      - backend-static:/app/staticfiles
    ports:
      - "8000:8000"

  frontend:
    build:
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_PROXY: http://backend:8000
      VITE_POLL: "1"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  backend-static:
  frontend-node-modules:
