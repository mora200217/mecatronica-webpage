# Producción (servidor Hetzner con Ubuntu).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# El override de desarrollo NO se aplica porque aquí los archivos son explícitos.

services:
  db:
    restart: always

  backend:
    restart: always
    environment:
      DJANGO_DEBUG: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS automático con Let's Encrypt. Solo arranca con:
  #   WEB_PORT=8080 docker compose ... --profile tls up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  caddy-data:
  caddy-config:
