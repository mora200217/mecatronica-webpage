# Producción (servidor Hetzner con Ubuntu).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# El override de desarrollo NO se aplica porque aquí los archivos son explícitos.
# Caddy toma los puertos 80 y 443, pide el certificado a Let's Encrypt y
# reenvía a nginx. El frontend no se publica al host para no pelearse con Caddy.

services:
  db:
    restart: always

  backend:
    restart: always
    environment:
      DJANGO_DEBUG: "false"
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-true}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: always
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?falta_SITE_DOMAIN_en_el_env}
      ACME_EMAIL: ${ACME_EMAIL:-${DJANGO_SUPERUSER_EMAIL:-admin@localhost}}
    entrypoint:
      - /bin/sh
      - -c
      - |
          SITE_DOMAIN=$$(printf '%s' "$$SITE_DOMAIN" | sed 's/, */, /g')
          export SITE_DOMAIN
          exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
