name: mecatronica25

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mecatronica}
      POSTGRES_USER: ${POSTGRES_USER:-mecatronica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mecatronica-dev}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mecatronica} -d ${POSTGRES_DB:-mecatronica}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mecatronica}
      POSTGRES_USER: ${POSTGRES_USER:-mecatronica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mecatronica-dev}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-solo-para-desarrollo-local}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ORIGINS: ${DJANGO_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      MEDIA_ROOT: /app/mediafiles
    volumes:
      - media-files:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      BACKEND_ORIGIN: http://backend:8000
    volumes:
      - media-files:/usr/share/nginx/uploads:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  media-files:
